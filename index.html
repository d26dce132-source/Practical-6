<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎓 Student Portal</h1>
        <p>Events, Students, Notices & FAQs</p>
    </header>

    <nav>
        <button onclick="showSection('events')">Events</button>
        <button onclick="showSection('students')">Students</button>
        <button onclick="showSection('notices')">Notices</button>
        <button onclick="showSection('faqs')">FAQs</button>
    </nav>

    <main>

        <section id="events" class="section">

            <h2>📅 Event List</h2>

            <div class="controls">

                <input
                    type="text"
                    id="eventSearch"
                    placeholder="Search events..."
                    oninput="searchEvents()"
                >

                <select id="eventFilter" onchange="filterEvents()">
                    <option value="all">All Categories</option>
                    <option value="Technical">Technical</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Sports">Sports</option>
                </select>

                <select id="eventSort" onchange="sortEvents()">
                    <option value="default">Sort By</option>
                    <option value="titleAsc">Title A-Z</option>
                    <option value="titleDesc">Title Z-A</option>
                    <option value="dateAsc">Date: Oldest First</option>
                    <option value="dateDesc">Date: Newest First</option>
                </select>

            </div>

            <div id="eventList" class="card-container"></div>
            <div id="eventPagination" class="pagination"></div>

        </section>


        <section id="students" class="section hidden">

            <h2>👨‍🎓 Student Profiles</h2>
            <div class="controls">

                <input
                    type="text"
                    id="studentSearch"
                    placeholder="Search students..."
                    oninput="searchStudents()"
                >

                <select id="studentFilter" onchange="filterStudents()">
                    <option value="all">All Departments</option>
                    <option value="Computer">Computer</option>
                    <option value="IT">IT</option>
                    <option value="AI">AI</option>
                </select>

                <select id="studentSort" onchange="sortStudents()">
                    <option value="default">Sort By</option>
                    <option value="nameAsc">Name A-Z</option>
                    <option value="nameDesc">Name Z-A</option>
                </select>

            </div>

            <div id="studentList" class="card-container"></div>
            <div id="studentPagination" class="pagination"></div>

        </section>

        <section id="notices" class="section hidden">

            <h2>📢 Notices</h2>

            <div class="controls">

                <input
                    type="text"
                    id="noticeSearch"
                    placeholder="Search notices..."
                    oninput="searchNotices()"
                >

            </div>

            <div id="noticeList" class="card-container"></div>
            <div id="noticePagination" class="pagination"></div>

        </section>


        <section id="faqs" class="section hidden">

            <h2>❓ Frequently Asked Questions</h2>

            <div class="controls">

                <input
                    type="text"
                    id="faqSearch"
                    placeholder="Search FAQs..."
                    oninput="searchFAQs()"
                >

            </div>

            <div id="faqList"></div>

        </section>

    </main>

    <footer>
        <p>Practical 5 | Fetch API & Dynamic JSON Data</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
